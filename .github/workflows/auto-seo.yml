name: Auto-SEO Monthly Report

on:
  workflow_dispatch:
    inputs:
      report_year:
        description: 'Reporting Year'
        type: choice
        required: true
        options:
          - '2026'
          - '2027'
          - '2028'
          - '2029'
          - '2030'
      report_month:
        description: 'Reporting Month'
        type: choice
        required: true
        options:
          - '01'
          - '02'
          - '03'
          - '04'
          - '05'
          - '06'
          - '07'
          - '08'
          - '09'
          - '10'
          - '11'
          - '12'
      cycle_type:
        description: 'Reporting Cycle'
        type: choice
        required: true
        options:
          - 'All'
          - '1-1'
          - '15-15'

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto-SEO Script
        env:
          GCREDS: ${{ secrets.GCREDS }}
          REPORT_MONTH: ${{ inputs.report_year }}-${{ inputs.report_month }}
          REPORT_CYCLE: ${{ inputs.cycle_type }}
        run: python main.py
